server {
    listen 80;
    server_name realsalepro.com www.realsalepro.com localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 1. Host Canonicalisation: Redirect www.* to apex in a single 301 hop (preserves path & query)
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # 2. Scheme Canonicalisation: Redirect plain HTTP to HTTPS in a single 301 hop
    if ($http_x_forwarded_proto = "http") {
        return 301 https://realsalepro.com$request_uri;
    }

    # 3. Trailing Slash Canonicalisation: 301 /page/ to /page (except root /)
    rewrite ^/(.+)/$ /$1 permanent;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
}
