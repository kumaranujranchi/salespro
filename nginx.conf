server {
    listen 80;
    server_name realsalepro.com www.realsalepro.com localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 1. Host Canonicalisation: Redirect www.* to apex in a single 301 hop (preserves path & query)
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # 2. Scheme Canonicalisation: Redirect plain HTTP to HTTPS in a single 301 hop
    if ($http_x_forwarded_proto = "http") {
        return 301 https://realsalepro.com$request_uri;
    }

    # 3. Trailing Slash Canonicalisation: 301 /page/ to /page (except root /)
    rewrite ^/(.+)/$ /$1 permanent;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml
        application/javascript
        application/json
        image/svg+xml;

    # Security Headers
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Fix XSL MIME type for sitemap styling
    location ~* \.xsl$ {
        default_type application/xslt+xml;
    }

    # Cache immutable Vite static assets (hashed files)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache public images and fonts
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Proxy API requests to Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Never cache service worker or index.html
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # SPA & Prerendered Static Routing:
    # 1. Matches exact file ($uri)
    # 2. Matches prerendered page without trailing slash ($uri.html -> 200 OK directly)
    # 3. Matches subfolder index ($uri/index.html)
    # 4. Falls back to SPA app.html (prevents marketing landing page flash on internal routes)
    location / {
        try_files $uri $uri.html $uri/index.html /app.html /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    error_page 404 /404.html;
}
