name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Lightsail Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sanitize Host and Verify Configuration
        id: check_secrets
        run: |
          RAW_HOST="${{ secrets.LIGHTSAIL_HOST }}"
          # Automatically strip http://, https://, trailing slashes, ports (:22), and whitespaces
          CLEAN_HOST=$(echo "$RAW_HOST" | sed -E 's|^https?://||' | sed -E 's|:[0-9]+/?$||' | sed 's|/.*$||' | tr -d '[:space:]')
          
          if [ -n "$CLEAN_HOST" ] && [ -n "${{ secrets.LIGHTSAIL_SSH_KEY }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            echo "host=$CLEAN_HOST" >> $GITHUB_OUTPUT
            echo "✅ Valid target host sanitized: $CLEAN_HOST"
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "⚠️ LIGHTSAIL_HOST or LIGHTSAIL_SSH_KEY is invalid or missing."
            echo "Please configure repository secrets: LIGHTSAIL_HOST, LIGHTSAIL_SSH_KEY, LIGHTSAIL_USERNAME."
          fi

      - name: Deploy via SSH to Lightsail
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.check_secrets.outputs.host }}
          username: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Deploying updates to /var/www/salespro..."
            cd /var/www/salespro
            git fetch origin main
            git reset --hard origin/main
            
            # Restart backend with PM2
            pm2 restart salespro-api --update-env || (cd server && pm2 start src/index.js --name "salespro-api")
            
            # Reload Nginx
            sudo systemctl reload nginx || sudo nginx -s reload
            
            echo "✅ Deployment finished successfully!"
